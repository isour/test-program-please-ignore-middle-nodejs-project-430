name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: 'npm'
      - run: npm ci
      - run: make build
      - run: make lint
      - run: make test
